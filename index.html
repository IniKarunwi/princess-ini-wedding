    <meta charset="UTF-8" />

    <title>Princess &amp; IniOluwa — Wedding Invitation</title>
    <meta name="description" content="You're invited! Join us on September 26, 2026 in Asokoro, Abuja." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ===================== FAVICON (unchanged) ===================== -->
    <link rel="icon" type="image/x-icon"           href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180"    href="/apple-touch-icon.png" />

    <!-- Web app manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme colour -->
    <meta name="theme-color" content="#2e5e40" />
    <meta name="msapplication-TileColor" content="#2e5e40" />
    <meta name="msapplication-TileImage" content="/android-chrome-192x192.png" />

    <!-- ========== SOCIAL PREVIEW (og-image-v2.jpg — 1200×630) ==========
         Platforms covered: WhatsApp, iMessage, Facebook, LinkedIn,
         X (Twitter), Discord, Slack.

         The card is the engagement portrait — the couple against the
         projected heart — cropped from the 1333×2000 original to the
         1200×630 the platforms expect. The crop keeps headroom above the
         crown and both faces near the centre, because several surfaces
         crop this further towards square and a face pushed to an edge is
         the first thing they cut.

         ── Two things that decide whether any of this is seen ───────────
         ABSOLUTE URLs. These were "/og-image.jpg". Open Graph requires a
         fully-qualified URL, and WhatsApp, Facebook and LinkedIn simply
         do not resolve a relative one — so the preview fell back to no
         image at all, no matter what the file contained.

         A NEW FILENAME. Platforms cache the preview against the image
         URL, for days. Replacing the bytes behind "og-image.jpg" would
         have left everyone who has already shared the link seeing the
         old card. A different path is a guaranteed cache miss.

         Twitter  : summary_large_image renders the wide card format.
         Discord  : reads og:image directly; 1200×630 renders banner-style.
         Slack    : reads og:image; title+description appear below.
    ================================================================== -->

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, iMessage, Discord, Slack) -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://princessandini.com/" />
    <meta property="og:title"        content="Princess &amp; IniOluwa — Wedding Invitation" />
    <meta property="og:description"  content="You're invited! Join us on September 26, 2026 in Asokoro, Abuja." />
    <meta property="og:image"        content="https://princessandini.com/og-image-v2.jpg" />
    <meta property="og:image:type"   content="image/jpeg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Princess and IniOluwa embracing, lit by a heart projected on the wall behind them" />

    <!-- X / Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Princess &amp; IniOluwa — Wedding Invitation" />
    <meta name="twitter:description" content="You're invited! Join us on September 26, 2026 in Asokoro, Abuja." />
    <meta name="twitter:image"       content="https://princessandini.com/og-image-v2.jpg" />
    <meta name="twitter:image:alt"   content="Princess and IniOluwa embracing, lit by a heart projected on the wall behind them" />

    <!-- ========================= FONTS =========================
         Self-hosted; the @font-face rules live in src/index.css.
         No preconnect and no Google stylesheet: both sat on the
         critical path for guests on Nigerian mobile data.

         The two faces the first screen paints are preloaded so they
         are fetched alongside the CSS rather than after the browser
         has parsed it and only then discovered the @font-face rules.
         The italic face is deliberately NOT preloaded — nothing above
         the fold is italic.
    ========================================================== -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/cormorant-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/pinyon-latin.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
